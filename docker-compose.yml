services:
    app:
        build:
            args:
                user: klaviyo-lw
                uid: 1000
            context: ./
            dockerfile: Dockerfile
        image: klaviyo-lw
        container_name: klaviyo-lw-app
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
            - ./docker-compose/php/project.ini:/usr/local/etc/php/conf.d/project.ini
        networks:
            - klaviyo-lw
        depends_on:
            - db
    # ponytail: Laravel needs schedule:run every minute; no host cron in this Docker setup
    scheduler:
        image: klaviyo-lw
        container_name: klaviyo-lw-scheduler
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
            - ./docker-compose/php/project.ini:/usr/local/etc/php/conf.d/project.ini
        networks:
            - klaviyo-lw
        depends_on:
            - db
            - app
        command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    db:
        image: mysql:8
        container_name: klaviyo-lw-db
        restart: unless-stopped
        ports:
            - ${DOCKER_DB_PORT}:3306
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - ./docker-compose/mysql/init:/docker-entrypoint-initdb.d
            - ./docker-compose/mysql/persistent:/var/lib/mysql
        networks:
            - klaviyo-lw
    nginx:
        image: nginx:stable-alpine
        container_name: klaviyo-lw-nginx
        restart: unless-stopped
        ports:
            - ${DOCKER_APP_PORT}:80
        volumes:
            - ./:/var/www
            - ./docker-compose/nginx:/etc/nginx/conf.d
        networks:
            - klaviyo-lw
        depends_on:
            - db
networks:
    klaviyo-lw:
        driver: bridge
